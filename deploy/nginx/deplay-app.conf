# Application Deplay : https://deplay.fabrich.site -> Nuxt sur 127.0.0.1:3100
# À copier dans /www/server/panel/vhost/nginx/ (inclus automatiquement par nginx.conf).
# Le certificat wildcard de fabrich.site couvre *.fabrich.site : pas de certificat dédié.

server {
    listen 80;
    listen [::]:80;
    server_name deplay.fabrich.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name deplay.fabrich.site;

    ssl_certificate     /www/server/panel/vhost/cert/fabrich.site/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/fabrich.site/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Les uploads de projets peuvent aller jusqu'à 200 Mo (la limite globale est 50 Mo)
    client_max_body_size 200m;

    # Pas de mise en tampon du corps : nginx transmet l'en-tête tout de suite à Nuxt.
    # Sinon le jeton Clerk, valable environ une minute, expire pendant un envoi long.
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    access_log /www/wwwlogs/deplay-app.log;
    error_log  /www/wwwlogs/deplay-app.error.log;
}
