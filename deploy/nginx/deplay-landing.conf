# Site public (landing, /runtimes, /docs) : https://deplay.fabrich.site, fichiers statiques.
# La plateforme (connexion, tableau de bord, API) est sur https://ondeplay.fabrich.site : voir deplay-app.conf.
# Le dossier servi est rempli par deploy/update.sh depuis public/landing-hero-concept.
# À copier dans /www/server/panel/vhost/nginx/. Le certificat wildcard de fabrich.site couvre ce domaine.

server {
    listen 80;
    listen [::]:80;
    server_name deplay.fabrich.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name deplay.fabrich.site;

    ssl_certificate     /www/server/panel/vhost/cert/fabrich.site/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/fabrich.site/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /www/wwwroot/deplay-landing;
    index index.html;

    # Anciennes adresses de l'application, qui était sur ce domaine : renvoyées vers la plateforme
    # (308 : la méthode et le corps des requêtes sont conservés, utile pour /api)
    location ~ ^/(sign-in|sign-up|sso-callback|projects|websites|webservices|deployments|logs|usage|settings|new|api|_nuxt)(/|$) {
        return 308 https://ondeplay.fabrich.site$request_uri;
    }

    # /runtimes -> runtimes.html, /docs -> docs.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    # Pas de mise en cache longue : les pages changent à chaque mise à jour
    add_header Cache-Control "no-cache" always;

    access_log /www/wwwlogs/deplay-landing.log;
    error_log  /www/wwwlogs/deplay-landing.error.log;
}
