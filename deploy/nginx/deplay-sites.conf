# Bloc nginx unique pour tous les sites statiques publiés : https://<nom>.fabrich.site
# Le dossier servi est /www/wwwroot/deplay-sites/<nom>, écrit par le worker : aucun rechargement ni sudo par déploiement.
# Les noms réservés (app, www, api...) ont leur propre configuration, plus précise, et n'arrivent pas ici.
# Installation : voir deploy/README.md (section « Sites statiques »).

server {
    listen 80;
    listen [::]:80;
    server_name "~^(?<site>[a-z0-9-]{3,40})\.fabrich\.site$";
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name "~^(?<site>[a-z0-9-]{3,40})\.fabrich\.site$";

    ssl_certificate     /www/server/panel/vhost/cert/fabrich.site/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/fabrich.site/privkey.pem;

    root /www/wwwroot/deplay-sites/$site;
    index index.html;

    # Sous-domaine sans site publié : 404, et aucun journal n'est créé pour lui
    set $site_known 0;
    if (-d $document_root) {
        set $site_known 1;
    }
    if ($site_known = 0) {
        return 404;
    }

    # Un site publié ne doit pas pouvoir lister ses dossiers ni servir des fichiers cachés
    autoindex off;
    location ~ /\. {
        deny all;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Journal par site, lu par l'application pour les compteurs (visites, requêtes, erreurs)
    access_log /www/wwwlogs/deplay-$site.log combined if=$site_known;
}
